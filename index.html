<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masuk — Kuis Digital SDM01KKS</title>
<meta name="theme-color" content="#0F6B5C">
<style>
  :root{
    --bg:#F7F6F1; --paper:#fff; --ink:#23241F; --soft:#5B5D55;
    --line:#E3E0D6; --brand:#0F6B5C; --brand-dark:#0B4F45; --radius:14px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px; line-height:1.5; display:flex; flex-direction:column;
  }
  header{
    background:var(--brand); color:#F4FBF9; padding:28px 20px 32px; text-align:center;
  }
  header .school{ font-size:.75em; letter-spacing:.04em; text-transform:uppercase; opacity:.85; }
  header h1{ margin:8px 0 0; font-size:1.45em; font-weight:800; }
  main{ flex:1; max-width:420px; width:100%; margin:0 auto; padding:28px 20px; }
  .lead{ text-align:center; color:var(--soft); font-size:.95em; margin:0 0 22px; }
  .role{
    display:block; width:100%; text-align:left; background:var(--paper);
    border:1.5px solid var(--line); border-radius:var(--radius); padding:18px 16px;
    margin-bottom:12px; cursor:pointer; font:inherit; color:inherit;
  }
  .role:hover{ border-color:#CFE3DA; }
  .role .t{ font-weight:700; font-size:1.05em; display:block; }
  .role .d{ font-size:.85em; color:var(--soft); margin-top:4px; display:block; }
  .guru-panel{
    display:none; background:var(--paper); border:1px solid var(--line);
    border-radius:var(--radius); padding:18px; margin-top:8px;
  }
  .guru-panel.show{ display:block; }
  label{ display:block; font-size:.85em; font-weight:600; color:var(--soft); margin-bottom:6px; }
  input{
    width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:10px;
    font:inherit; margin-bottom:12px;
  }
  .btn{
    width:100%; border:0; border-radius:12px; padding:13px; font:inherit; font-weight:700;
    background:var(--brand); color:#fff; cursor:pointer;
  }
  .btn:disabled{ opacity:.55; }
  .msg{ display:none; margin-top:10px; padding:10px 12px; border-radius:10px; font-size:.9em; }
  .msg.show{ display:block; }
  .msg.err{ background:#FBEAE6; color:#C24B3F; }
  .msg.ok{ background:#E4F3EC; color:var(--brand-dark); }
  footer{ text-align:center; color:var(--soft); font-size:.8em; padding:16px; }
</style>
</head>
<body>
<header>
  <div class="school">SD Muhammadiyah 01 Kukusan</div>
  <h1>Kuis Digital</h1>
</header>
<main>
  <p class="lead">Pilih bagaimana kamu masuk.</p>

  <button type="button" class="role" id="btnSiswa">
    <span class="t">Saya siswa</span>
    <span class="d">Kerjakan kuis dan latihan asesmen</span>
  </button>

  <button type="button" class="role" id="btnGuruShow">
    <span class="t">Saya guru</span>
    <span class="d">Kelola latihan, bank soal, dan pengaturan</span>
  </button>

  <div class="guru-panel" id="guruPanel">
    <label for="sandiGuru">Sandi guru</label>
    <input id="sandiGuru" type="password" autocomplete="current-password" placeholder="Sandi dari admin">
    <button type="button" class="btn" id="btnGuruLogin">Masuk sebagai guru</button>
    <div id="msgGuru" class="msg"></div>
  </div>
</main>
<footer>Kelas 5 · SD Muhammadiyah 01 Kukusan</footer>
<script>
(function(){
  var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwotrwYBt0_-_9g4o2gNs6ktaTn1sw41f3jJlgoK5pN2N5RofwRjOeiSqzQq1JZsjhclw/exec';
  var KEY = 'kuis-guru-ok';

  document.getElementById('btnSiswa').onclick = function(){
    location.href = 'beranda.html';
  };
  document.getElementById('btnGuruShow').onclick = function(){
    document.getElementById('guruPanel').classList.add('show');
    document.getElementById('sandiGuru').focus();
  };

  document.getElementById('btnGuruLogin').onclick = function(){
    var btn = this;
    var sandi = (document.getElementById('sandiGuru').value || '').trim();
    var msg = document.getElementById('msgGuru');
    if (!sandi) {
      msg.className = 'msg show err';
      msg.textContent = 'Isi sandi guru.';
      return;
    }
    btn.disabled = true;
    msg.className = 'msg show ok';
    msg.textContent = 'Memeriksa…';
    fetch(WEBAPP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'loginGuru', sandi: sandi })
    }).then(function(r){ return r.json(); }).then(function(res){
      btn.disabled = false;
      if (res && res.ok) {
        sessionStorage.setItem(KEY, '1');
        sessionStorage.setItem('kuis-guru-token', sandi);
        location.href = 'guru/';
      } else {
        msg.className = 'msg show err';
        msg.textContent = (res && res.pesan) || 'Sandi salah.';
      }
    }).catch(function(){
      btn.disabled = false;
      msg.className = 'msg show err';
      msg.textContent = 'Tidak terhubung ke server. Pastikan Code.gs sudah di-deploy.';
    });
  };
})();
</script>
</body>
</html>
